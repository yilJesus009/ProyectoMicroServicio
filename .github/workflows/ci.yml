# =============================================================================
# Integración continua
# =============================================================================
# Ejecuta lint y pruebas en cada Pull Request hacia `develop` o `main`.
#
# El workflow detecta qué servicios cambiaron y solo ejecuta los que existen.
# Así el CI funciona desde el primer día, aunque los servicios se vayan
# creando gradualmente.
#
# IMPORTANTE: un PR no se merguea con el CI en rojo. `develop` debe mantenerse
# funcional.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Estructura del monorepo y documentación
  # ---------------------------------------------------------------------------
  repo-structure:
    name: Estructura y documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar archivos obligatorios
        shell: bash
        run: |
          set -e
          required=(
            "AGENTS.md"
            "README.md"
            "docker-compose.yml"
            ".env.example"
            "docs/convenciones.md"
            "docs/arquitectura.md"
            "docs/eventos.md"
            "docs/contratos-api.md"
            "docs/flujo-principal.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Falta el archivo obligatorio $f"
              missing=1
            fi
          done
          exit $missing

      - name: Verificar que no haya secretos commiteados
        shell: bash
        run: |
          set -e
          # Un .env real (que no sea .example) no debe estar versionado
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::Se encontró un archivo .env versionado. Debe estar en .gitignore."
            exit 1
          fi
          echo "Sin archivos .env versionados."

      - name: Validar docker-compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Verificar que .env.example documenta todos los puertos
        shell: bash
        run: |
          set -e
          for port in 4000 4001 4003 4004 4005 5000 4200; do
            if ! grep -q "$port" .env.example; then
              echo "::error::El puerto $port no está documentado en .env.example"
              exit 1
            fi
          done
          echo "Todos los puertos documentados."

  # ---------------------------------------------------------------------------
  # Servicios Express
  # ---------------------------------------------------------------------------
  express-services:
    name: Express (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - negociacion
          - notificaciones
    steps:
      - uses: actions/checkout@v4

      - name: Detectar si el servicio existe
        id: check
        shell: bash
        run: |
          service_dir="apps/${{ matrix.service }}"

          if [ -f "$service_dir/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$service_dir" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El servicio ${{ matrix.service }} aún no existe. Se omite."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.check.outputs.path }}/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ steps.check.outputs.path }}
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ steps.check.outputs.path }}
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "Sin script de lint. Omitido."
          fi

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ steps.check.outputs.path }}
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "::notice::Sin pruebas todavía en ${{ matrix.service }}. Agregarlas pronto."
          fi

  # ---------------------------------------------------------------------------
  # Identidad (Django)
  # ---------------------------------------------------------------------------
  identidad:
    name: Identidad (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar si el servicio existe
        id: check
        shell: bash
        run: |
          if [ -f "apps/identidad/manage.py" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::identidad aún no existe. Se omite."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/identidad/requirements.txt

      - name: Instalar dependencias
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/identidad
        run: pip install -r requirements.txt

      - name: Verificar configuración
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/identidad
        env:
          # settings.py falla al arrancar sin secretos (AGENTS.md 4.6):
          # fuera de `manage.py test` no hay valores por defecto.
          DJANGO_SECRET_KEY: ci-test-secret-key-no-usar-en-produccion
          JWT_SECRET: ci-jwt-secret-para-pruebas-no-usar-en-produccion
        run: python manage.py check

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/identidad
        env:
          # En `manage.py test` settings.py usa SQLite en memoria; estas
          # variables documentan la configuración real de .env.example
          # (un solo PostgreSQL, esquema `identidad`).
          DB_NAME: repuestosya
          DB_IDENTIDAD_USER: identidad_user
          DB_IDENTIDAD_PASSWORD: identidad_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DJANGO_SECRET_KEY: ci-test-secret-key-no-usar-en-produccion
          # Los JWT se firman con JWT_SECRET (AGENTS.md 4.5), no con
          # DJANGO_SECRET_KEY; sin esto SimpleJWT caería al fallback.
          JWT_SECRET: ci-jwt-secret-para-pruebas-no-usar-en-produccion
        run: python manage.py test --verbosity 2

  # ---------------------------------------------------------------------------
  # Catalogo (NestJS)
  # ---------------------------------------------------------------------------
  catalogo:
    name: Catalogo (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar si el servicio existe
        id: check
        shell: bash
        run: |
          if [ -f "apps/catalogo/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::catalogo aún no existe. Se omite."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/catalogo/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/catalogo
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/catalogo
        run: npm run build

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/catalogo
        run: npm test

  # ---------------------------------------------------------------------------
  # Pedidos (Spring Boot)
  # ---------------------------------------------------------------------------
  pedidos:
    name: Pedidos (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar si el servicio existe
        id: check
        shell: bash
        run: |
          if [ -f "apps/pedidos/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pedidos aún no existe. Se omite."
          fi

      - uses: actions/setup-java@v6
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/pedidos/pom.xml

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/pedidos
        run: mvn -B test

  # ---------------------------------------------------------------------------
  # Frontend (Angular)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar si el frontend existe
        id: check
        shell: bash
        run: |
          if [ -f "apps/frontend/angular.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El frontend aún no existe. Se omite."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/frontend
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/frontend
        run: npx ng build --configuration production

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
