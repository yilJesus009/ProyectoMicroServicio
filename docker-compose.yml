# =============================================================================
# RepuestosYa - docker-compose.yml
# =============================================================================
# Levanta la infraestructura y los servicios.
#
#   docker compose up --build       -> levanta todo
#   docker compose ps               -> verifica que este corriendo
#   docker compose logs -f <svc>    -> ver logs de un servicio
#   docker compose down -v          -> apagar y BORRA los datos
#
# Reglas (AGENTS.md 4.4): fuera de Docker solo se exponen el Gateway (4000),
# el frontend (4200) y la UI de RabbitMQ (15672, solo para la demo). Los
# demas servicios NO tienen puertos publicados: se llega a ellos por el
# Gateway.
#
# Orden de arranque: healthcheck + `condition: service_healthy` garantiza que
# nadie arrance antes que la base o RabbitMQ (decisiones.md D4).
#
# Los servicios que faltan en esta fase se agregan aqui en su propio PR:
#   - frontend  -> Bloque B
# =============================================================================

name: repuestos-marketplace

services:

  # ---------------------------------------------------------------------------
  # BASE DE DATOS - un solo PostgreSQL, un esquema por servicio
  # init.sql crea los 5 esquemas y los 5 usuarios al iniciar con volumen nuevo.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-repuestosya}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d ${DB_NAME:-repuestosya}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MENSAJERIA - comunicacion asincrona entre microservicios (eventos)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: marketplace-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"   # UI -> http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # IDENTIDAD (Django + DRF) - puerto interno 5000, NO expuesto
  # ---------------------------------------------------------------------------
  identidad:
    build:
      context: ./apps/identidad
      dockerfile: Dockerfile
    container_name: marketplace-identidad
    restart: unless-stopped
    environment:
      # Base: esquema `identidad` dentro de la base `repuestosya`
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-repuestosya}
      DB_IDENTIDAD_USER: ${DB_IDENTIDAD_USER:-identidad_user}
      DB_IDENTIDAD_PASSWORD: ${DB_IDENTIDAD_PASSWORD:-identidad_pass}
      # El host del contenedor es `identidad`; Django lo exige en ALLOWED_HOSTS
      IDENTITY_ALLOWED_HOSTS: ${IDENTITY_ALLOWED_HOSTS:-localhost,127.0.0.1,identidad}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambia-este-django-secret-key-en-produccion}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-min-32-caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      # Admin creado al iniciar si no existe
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@repuestosya.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambia-esta-password-admin-inicial}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------------------------------------------------------------------
  # NEGOCIACION (Express) - puerto interno 4001, NO expuesto
  # ---------------------------------------------------------------------------
  negociacion:
    build:
      context: ./apps/negociacion
      dockerfile: Dockerfile
    container_name: marketplace-negociacion
    restart: unless-stopped
    environment:
      # Base: esquema `negociacion` dentro de la base `repuestosya`
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-repuestosya}
      DB_NEGOCIACION_USER: ${DB_NEGOCIACION_USER:-negociacion_user}
      DB_NEGOCIACION_PASSWORD: ${DB_NEGOCIACION_PASSWORD:-negociacion_pass}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-min-32-caracteres}
      NEGOCIACION_PORT: ${NEGOCIACION_PORT:-4001}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - uploads_requests:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NEGOCIACION_PORT:-4001}/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # CATALOGO (NestJS) - puerto interno 4004, NO expuesto
  # ---------------------------------------------------------------------------
  catalogo:
    build:
      context: ./apps/catalogo
      dockerfile: Dockerfile
    container_name: marketplace-catalogo
    restart: unless-stopped
    environment:
      # Base: esquema `catalogo` dentro de la base `repuestosya`
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-repuestosya}
      DB_CATALOGO_USER: ${DB_CATALOGO_USER:-catalogo_user}
      DB_CATALOGO_PASSWORD: ${DB_CATALOGO_PASSWORD:-catalogo_pass}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-min-32-caracteres}
      CATALOGO_PORT: ${CATALOGO_PORT:-4004}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${CATALOGO_PORT:-4004}/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # PEDIDOS (Spring Boot) - puerto interno 4003, NO expuesto
  # ---------------------------------------------------------------------------
  pedidos:
    build:
      context: ./apps/pedidos
      dockerfile: Dockerfile
    container_name: marketplace-pedidos
    restart: unless-stopped
    environment:
      # Base: esquema `pedidos` dentro de la base `repuestosya`
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-repuestosya}
      DB_PEDIDOS_USER: ${DB_PEDIDOS_USER:-pedidos_user}
      DB_PEDIDOS_PASSWORD: ${DB_PEDIDOS_PASSWORD:-pedidos_pass}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-min-32-caracteres}
      PEDIDOS_PORT: ${PEDIDOS_PORT:-4003}
      # RabbitMQ: deja creada pedidos.offer_accepted (sin consumidor todavia)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PEDIDOS_PORT:-4003}/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------------------------------------------------------------------
  # NOTIFICACIONES (Express) - puerto interno 4005, NO expuesto
  # ---------------------------------------------------------------------------
  notificaciones:
    build:
      context: ./apps/notificaciones
      dockerfile: Dockerfile
    container_name: marketplace-notificaciones
    restart: unless-stopped
    environment:
      # Base: esquema `notificaciones` dentro de la base `repuestosya`
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-repuestosya}
      DB_NOTIFICACIONES_USER: ${DB_NOTIFICACIONES_USER:-notificaciones_user}
      DB_NOTIFICACIONES_PASSWORD: ${DB_NOTIFICACIONES_PASSWORD:-notificaciones_pass}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-min-32-caracteres}
      NOTIFICACIONES_PORT: ${NOTIFICACIONES_PORT:-4005}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NOTIFICACIONES_PORT:-4005}/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # GATEWAY (Express) - puerto 4000, UNICO punto de entrada expuesto
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: marketplace-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:${GATEWAY_PORT:-4000}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-min-32-caracteres}
      # CORS: solo el origen del frontend
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # URLs internas por nombre de contenedor (nunca localhost dentro de Docker)
      IDENTIDAD_SERVICE_URL: ${IDENTIDAD_SERVICE_URL:-http://identidad:5000}
      NEGOCIACION_SERVICE_URL: ${NEGOCIACION_SERVICE_URL:-http://negociacion:4001}
      PEDIDOS_SERVICE_URL: ${PEDIDOS_SERVICE_URL:-http://pedidos:4003}
      CATALOGO_SERVICE_URL: ${CATALOGO_SERVICE_URL:-http://catalogo:4004}
      NOTIFICACIONES_SERVICE_URL: ${NOTIFICACIONES_SERVICE_URL:-http://notificaciones:4005}
    depends_on:
      identidad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${GATEWAY_PORT:-4000}/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
  uploads_requests:
