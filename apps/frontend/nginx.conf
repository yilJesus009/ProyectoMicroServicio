# =============================================================================
# nginx del frontend (Angular)
# =============================================================================
# Sirve la SPA compilada y devuelve index.html para cualquier ruta que no
# sea un archivo: si no, entrar a http://localhost:4200/comprador/pedidos
# daría 404 porque esos archivos no existen en disco.
# =============================================================================

server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html sin caché: así un build nuevo se ve apenas se redespliega.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los archivos llevan hash en el nombre (main-7GWECPZ7.js), así que una
    # versión vieja nunca se sirve por accidente y sí se puede cachear.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Ruta de la SPA (o un archivo que exista); si no, index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
