<section class="pantalla">
  <header class="encabezado-pagina">
    <h1 class="encabezado-pagina__titulo">Mis pedidos</h1>
    <a mat-stroked-button color="primary" routerLink="/comprador/solicitudes">Mis solicitudes</a>
  </header>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
    <p class="estado-carga">Cargando pedidos…</p>
  } @else if (error(); as mensaje) {
    <p class="mensaje-servidor" role="alert">
      <mat-icon aria-hidden="true">error</mat-icon>
      <span>{{ mensaje }}</span>
    </p>
  } @else if (lista().length === 0) {
    <div class="panel vacio">
      <p class="vacio__texto">Todavía no tienes pedidos. Cuando aceptes una oferta aparecerá aquí.</p>
    </div>
  } @else {
    <ul class="lista">
      @for (pedido of lista(); track pedido.id) {
        <li>
          <a class="tarjeta-enlace" [routerLink]="['/comprador/pedidos', pedido.id]">
            <app-order-card [pedido]="pedido" />
          </a>
        </li>
      }
    </ul>
  }
</section>
