server:
  port: ${PEDIDOS_PORT:4003}

spring:
  application:
    name: pedidos

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=pedidos
    username: ${DB_PEDIDOS_USER}
    password: ${DB_PEDIDOS_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el UNICO que crea o cambia tablas (AGENTS.md 4.7): Hibernate
      # solo valida que las entidades coincidan con lo que Flyway ya creo.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pedidos
        format_sql: false

  flyway:
    enabled: true
    schemas: pedidos
    default-schema: pedidos
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # Confirmacion real del broker al publicar (docs/eventos.md): el
    # OutboxPublisherScheduler usa waitForConfirmsOrDie.
    publisher-confirm-type: correlated
    listener:
      simple:
        # Cualquier excepcion del @RabbitListener (sin event_id, JSON
        # invalido, error real) -> nack sin reencolar -> dlq (docs/eventos.md).
        # Sin esto, por defecto Spring reencola indefinidamente.
        default-requeue-rejected: false

app:
  jwt:
    secret: ${JWT_SECRET}
